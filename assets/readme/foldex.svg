<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Foldex — Every file, one place</title>
  <desc id="d">A PDF page whose heading is being retyped in place, with a signature being drawn and file-format chips floating around. Foldex: a free, offline Windows PDF editor and converter for 244 file formats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#05071a"/>
    </linearGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22a6f2"/>
      <stop offset=".5" stop-color="#3b6cf0"/>
      <stop offset="1" stop-color="#8b3df0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .sans{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .old{animation:old 8s ease-in-out infinite}
      .new{animation:new 8s ease-in-out infinite}
      .caret{animation:caret 1s steps(1) infinite}
      .sel{animation:sel 8s ease-in-out infinite}
      .sig{stroke-dasharray:420;animation:sig 8s ease-in-out infinite}
      .chip{animation:float 6s ease-in-out infinite alternate}
      .twinkle{animation:tw 4s ease-in-out infinite alternate}
      @keyframes old{0%,22%{opacity:1}30%,88%{opacity:0}96%,100%{opacity:1}}
      @keyframes new{0%,30%{opacity:0}38%,88%{opacity:1}96%,100%{opacity:0}}
      @keyframes sel{0%,8%{opacity:0}14%,46%{opacity:1}54%,100%{opacity:0}}
      @keyframes sig{0%,50%{stroke-dashoffset:420}72%,90%{stroke-dashoffset:0}98%,100%{stroke-dashoffset:420}}
      @keyframes caret{50%{opacity:0}}
      @keyframes float{to{transform:translateY(-10px)}}
      @keyframes tw{to{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.old,.new,.caret,.sel,.sig,.chip,.twinkle{animation:none}.old,.sel{opacity:0}.sig{stroke-dashoffset:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <ellipse cx="930" cy="120" rx="360" ry="220" fill="url(#neb1)"/>
    <ellipse cx="760" cy="300" rx="300" ry="160" fill="url(#neb2)"/>
    <g class="twinkle"><circle cx="663" cy="77" r="1.2" fill="#fff" opacity="0.25"/><circle cx="148" cy="274" r="0.6" fill="#fff" opacity="0.5"/><circle cx="1193" cy="29" r="0.8" fill="#fff" opacity="0.25"/><circle cx="176" cy="222" r="1.2" fill="#fff" opacity="0.25"/><circle cx="492" cy="46" r="1.2" fill="#fff" opacity="0.25"/><circle cx="1158" cy="63" r="0.8" fill="#fff" opacity="0.25"/><circle cx="1181" cy="299" r="1.2" fill="#fff" opacity="0.25"/><circle cx="452" cy="23" r="0.8" fill="#fff" opacity="0.5"/><circle cx="858" cy="73" r="0.6" fill="#fff" opacity="0.5"/><circle cx="1147" cy="349" r="0.8" fill="#fff" opacity="0.25"/><circle cx="1191" cy="292" r="0.8" fill="#fff" opacity="0.5"/><circle cx="199" cy="280" r="0.6" fill="#fff" opacity="0.25"/><circle cx="421" cy="254" r="1.2" fill="#fff" opacity="0.5"/><circle cx="953" cy="299" r="1.2" fill="#fff" opacity="0.5"/><circle cx="613" cy="127" r="0.8" fill="#fff" opacity="0.35"/><circle cx="167" cy="294" r="1" fill="#fff" opacity="0.7"/><circle cx="703" cy="229" r="1" fill="#fff" opacity="0.25"/><circle cx="241" cy="262" r="1.2" fill="#fff" opacity="0.35"/><circle cx="700" cy="77" r="1.2" fill="#fff" opacity="0.7"/><circle cx="80" cy="342" r="0.6" fill="#fff" opacity="0.5"/><circle cx="696" cy="355" r="1" fill="#fff" opacity="0.7"/><circle cx="1187" cy="233" r="0.6" fill="#fff" opacity="0.25"/><circle cx="552" cy="242" r="0.6" fill="#fff" opacity="0.25"/><circle cx="634" cy="331" r="1.2" fill="#fff" opacity="0.5"/><circle cx="790" cy="342" r="1" fill="#fff" opacity="0.25"/><circle cx="945" cy="181" r="0.8" fill="#fff" opacity="0.25"/><circle cx="1011" cy="30" r="0.8" fill="#fff" opacity="0.5"/><circle cx="264" cy="126" r="1.2" fill="#fff" opacity="0.7"/><circle cx="1016" cy="41" r="0.8" fill="#fff" opacity="0.7"/><circle cx="822" cy="281" r="1" fill="#fff" opacity="0.35"/><circle cx="881" cy="281" r="1" fill="#fff" opacity="0.7"/><circle cx="734" cy="349" r="1.2" fill="#fff" opacity="0.35"/><circle cx="309" cy="42" r="0.8" fill="#fff" opacity="0.35"/><circle cx="475" cy="337" r="0.8" fill="#fff" opacity="0.25"/><circle cx="993" cy="301" r="0.8" fill="#fff" opacity="0.5"/><circle cx="577" cy="2" r="0.8" fill="#fff" opacity="0.7"/><circle cx="1094" cy="189" r="1" fill="#fff" opacity="0.35"/><circle cx="1055" cy="316" r="0.6" fill="#fff" opacity="0.7"/><circle cx="1145" cy="200" r="1.2" fill="#fff" opacity="0.7"/><circle cx="807" cy="53" r="1.2" fill="#fff" opacity="0.7"/><circle cx="127" cy="97" r="0.6" fill="#fff" opacity="0.35"/><circle cx="902" cy="83" r="0.6" fill="#fff" opacity="0.5"/><circle cx="107" cy="52" r="0.6" fill="#fff" opacity="0.35"/><circle cx="1098" cy="51" r="1" fill="#fff" opacity="0.25"/><circle cx="144" cy="106" r="1.2" fill="#fff" opacity="0.35"/><circle cx="516" cy="177" r="1" fill="#fff" opacity="0.7"/><circle cx="251" cy="59" r="1.2" fill="#fff" opacity="0.7"/><circle cx="983" cy="247" r="1" fill="#fff" opacity="0.25"/><circle cx="295" cy="52" r="1" fill="#fff" opacity="0.5"/><circle cx="980" cy="354" r="0.8" fill="#fff" opacity="0.25"/><circle cx="420" cy="270" r="1" fill="#fff" opacity="0.35"/><circle cx="1112" cy="13" r="1" fill="#fff" opacity="0.25"/><circle cx="534" cy="265" r="1" fill="#fff" opacity="0.35"/><circle cx="728" cy="114" r="1" fill="#fff" opacity="0.35"/><circle cx="399" cy="122" r="1.2" fill="#fff" opacity="0.35"/><circle cx="409" cy="265" r="1.2" fill="#fff" opacity="0.5"/><circle cx="59" cy="14" r="1" fill="#fff" opacity="0.7"/><circle cx="530" cy="99" r="1" fill="#fff" opacity="0.7"/><circle cx="715" cy="186" r="0.6" fill="#fff" opacity="0.35"/><circle cx="209" cy="116" r="1.2" fill="#fff" opacity="0.35"/><circle cx="691" cy="104" r="1.2" fill="#fff" opacity="0.25"/><circle cx="981" cy="334" r="1" fill="#fff" opacity="0.25"/><circle cx="245" cy="198" r="0.8" fill="#fff" opacity="0.7"/><circle cx="365" cy="222" r="1" fill="#fff" opacity="0.25"/><circle cx="810" cy="237" r="1.2" fill="#fff" opacity="0.25"/><circle cx="325" cy="87" r="0.8" fill="#fff" opacity="0.25"/><circle cx="309" cy="302" r="1.2" fill="#fff" opacity="0.35"/><circle cx="971" cy="336" r="1" fill="#fff" opacity="0.35"/><circle cx="1123" cy="280" r="0.8" fill="#fff" opacity="0.25"/><circle cx="29" cy="332" r="0.6" fill="#fff" opacity="0.35"/></g>

    <!-- document page -->
    <g transform="translate(760 24) rotate(-4)">
      <rect x="6" y="10" width="300" height="322" rx="10" fill="#000" opacity=".35"/>
      <rect width="300" height="322" rx="10" fill="#f7f8fc"/>
      <rect x="0" y="0" width="300" height="6" rx="3" fill="url(#brand)"/>
      <!-- heading: old / new -->
      <g class="sel"><rect x="22" y="30" width="238" height="38" rx="6" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-width="2"/><rect class="caret" x="236" y="38" width="2.5" height="24" fill="#7c3aed"/></g>
      <text class="sans old" x="30" y="57" font-size="22" font-weight="700" fill="#1e3a8a">Draft Agreement</text>
      <text class="sans new" x="30" y="57" font-size="22" font-weight="700" fill="#1e3a8a">Service Agreement</text>
      
      <!-- body lines -->
      <g fill="#c9cfe0">
        <rect x="30" y="88" width="236" height="7" rx="3.5"/>
        <rect x="30" y="104" width="214" height="7" rx="3.5"/>
        <rect x="30" y="120" width="228" height="7" rx="3.5"/>
        <rect x="30" y="148" width="120" height="8" rx="4" fill="#9fb0d8"/>
        <rect x="30" y="166" width="236" height="7" rx="3.5"/>
        <rect x="30" y="182" width="190" height="7" rx="3.5"/>
        <rect x="30" y="198" width="222" height="7" rx="3.5"/>
      </g>
      <!-- form field -->
      <rect x="30" y="220" width="110" height="22" rx="4" fill="#eef1fb" stroke="#b9c3e6"/>
      <path d="M36 231 l5 5 l9 -11" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="58" y="228" width="70" height="6" rx="3" fill="#b9c3e6"/>
      <!-- signature -->
      <line x1="30" y1="300" x2="190" y2="300" stroke="#9aa3bd" stroke-width="1.2"/>
      <path class="sig" d="M36 292 C 46 262, 58 262, 56 286 C 54 306, 70 270, 82 278 C 92 284, 88 296, 100 284 C 112 272, 116 292, 128 282 C 140 272, 150 286, 176 276" fill="none" stroke="#1d3fbf" stroke-width="2.6" stroke-linecap="round"/>
      <text class="mono" x="30" y="318" font-size="9" letter-spacing="1" fill="#8a93ad">SIGNATURE</text>
    </g>

    <!-- format chips -->
    <g class="chip"><rect x="676" y="72" width="62" height="30" rx="8" fill="#ef4444"/><text class="sans" x="707" y="92" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PDF</text></g>
    <g class="chip" style="animation-delay:-2s"><rect x="1088" y="64" width="70" height="30" rx="8" fill="#2563eb"/><text class="sans" x="1123" y="84" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DOCX</text></g>
    <g class="chip" style="animation-delay:-3.5s"><rect x="1094" y="250" width="66" height="30" rx="8" fill="#0ea5e9"/><text class="sans" x="1127" y="270" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">HEIC</text></g>
    <g class="chip" style="animation-delay:-1s"><rect x="664" y="252" width="62" height="30" rx="8" fill="#a855f7"/><text class="sans" x="695" y="272" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MP4</text></g>

    <!-- copy -->
    <text class="mono" x="60" y="66" font-size="12.5" letter-spacing="3" fill="#22d3ee">FEATURED PRODUCT · OPEN SOURCE</text>
    <g transform="translate(60 96)">
