      <rect x="0" y="12" width="52" height="40" rx="8" fill="#3b8ef5"/>
      <rect x="6" y="20" width="52" height="38" rx="8" fill="url(#folder)" stroke="#a5b4fc" stroke-opacity=".6"/>
      <path d="M22 28 h26 a4 4 0 0 1 0 8 h-21 l-1.6 6 h15 a3.5 3.5 0 0 1 0 7 h-17 l-2.4 9 h-7 z" fill="#dbeafe"/>
    </g>
    <text class="sans" x="134" y="150" font-size="70" font-weight="700" letter-spacing="-3" fill="#eef2ff">Fold<tspan fill="url(#brand)">ex</tspan></text>
    <text class="mono" x="62" y="188" font-size="13" letter-spacing="3.6" fill="#c4b5fd">EDIT THE TEXT IN ANY PDF</text>
    <text class="sans" x="62" y="240" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#bfefff">244</text>
    <text class="mono" x="64" y="264" font-size="11" letter-spacing="2" fill="#8e9ac0">FILE FORMATS</text>
    <text class="sans" x="250" y="240" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#bfefff">0</text>
    <text class="mono" x="252" y="264" font-size="11" letter-spacing="2" fill="#8e9ac0">FILES UPLOADED — RUNS OFFLINE</text>
    <text class="mono" x="62" y="318" font-size="11" letter-spacing="2" fill="#6f7aa3">FREE · WINDOWS 10 / 11 · MIT</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#a5b4fc" stroke-opacity=".2"/>
</svg>