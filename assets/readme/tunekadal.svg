<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TuneKadal — Ocean of Tamil Tunes</title>
  <desc id="d">A lighthouse on a rock sweeping its beam across a dark ocean, with radio waves. TuneKadal: 244+ Tamil radio stations on Android and iOS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04182b"/>
      <stop offset="1" stop-color="#020b14"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#fff4dc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6fdcff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4dc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .sans{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .beam{transform-origin:905px 118px;animation:beam 9s ease-in-out infinite}
      .wave{transform-origin:905px 118px;fill:none;stroke:#62d8ff;animation:wave 3.6s ease-out infinite}
      .sea{animation:sea 7s ease-in-out infinite alternate}
      @keyframes beam{0%,100%{transform:rotate(-14deg);opacity:.35}50%{transform:rotate(10deg);opacity:1}}
      @keyframes wave{from{transform:scale(.3);opacity:.7}to{transform:scale(4.5);opacity:0}}
      @keyframes sea{to{transform:translateX(-40px)}}
      @media (prefers-reduced-motion:reduce){.beam,.wave,.sea{animation:none}.wave{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <g class="beam">
      <polygon points="905,118 1260,30 1260,210" fill="url(#beam)"/>
      <polygon points="905,118 560,40 560,200" fill="url(#beam)" opacity=".5"/>
    </g>
    <circle class="wave" cx="905" cy="118" r="18"/>
    <circle class="wave" cx="905" cy="118" r="18" style="animation-delay:-1.2s"/>
    <circle class="wave" cx="905" cy="118" r="18" style="animation-delay:-2.4s"/>
    <circle cx="905" cy="118" r="40" fill="url(#lamp)"/>
    <!-- rock + tower -->
    <path d="M800 330 Q840 286 890 292 Q930 280 980 300 Q1020 312 1040 340 L1040 360 L790 360 Z" fill="#0f2c46"/>
    <path d="M884 300 L893 132 H917 L926 300 Z" fill="#dbe7f1"/>
    <path d="M887.6 236 L889.6 196 H920.4 L922.4 236 Z M885.9 285 L886.9 262 H923.1 L924.1 285 Z" fill="#1e5f8c"/>
    <rect x="886" y="126" width="38" height="7" fill="#0e2740"/>
    <rect x="895" y="104" width="20" height="22" fill="#fff4dc"/>
    <path d="M890 104 L905 88 L920 104 Z" fill="#0e2740"/>
    <!-- sea -->
    <g class="sea">
      <path d="M0 322 C 60 312 120 332 180 322 S 300 312 360 322 S 480 332 540 322 S 660 312 720 322 S 840 332 900 322 S 1020 312 1080 322 S 1200 332 1260 322 V360 H0Z" fill="#06203a" fill-opacity=".85"/>
    </g>
    <!-- copy -->
    <text class="mono" x="60" y="76" font-size="12.5" letter-spacing="3" fill="#62d8ff">FEATURED PRODUCT</text>
    <text class="sans" x="58" y="148" font-size="70" font-weight="700" letter-spacing="-3" fill="#eef6ff">TuneKadal</text>
    <text class="mono" x="62" y="184" font-size="13" letter-spacing="3.6" fill="#fff1d6">OCEAN OF TAMIL TUNES</text>
    <text class="sans" x="62" y="236" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#bfefff">244+</text>
    <text class="mono" x="64" y="260" font-size="11" letter-spacing="2" fill="#7f95b0">TAMIL RADIO STATIONS</text>
    <text class="sans" x="290" y="236" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#bfefff">2</text>
    <text class="mono" x="292" y="260" font-size="11" letter-spacing="2" fill="#7f95b0">PLATFORMS — ANDROID &amp; iOS</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="23.5" fill="none" stroke="#8cc8ff" stroke-opacity=".18"/>
</svg>
