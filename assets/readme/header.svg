<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Shinoj Jerald — Business Intelligence Analyst</title>
  <desc id="d">Data Analytics, BI, Python, SQL, Power BI. A dark ocean-themed banner with a faceted data core and a flowing waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051430"/>
      <stop offset=".6" stop-color="#030a16"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3d7dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3d7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#9be7ff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#1f5fae"/>
      <stop offset="1" stop-color="#061a36"/>
    </radialGradient>
    <linearGradient id="name2" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#3d7dff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" x2="1">
      <stop offset="0" stop-color="#62d8ff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#62d8ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="440" rx="24"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .sans{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .spin{transform-origin:900px 212px;animation:spin 90s linear infinite}
      .spin2{transform-origin:900px 212px;animation:spin 140s linear infinite reverse}
      .breathe{transform-origin:900px 212px;animation:breathe 8s ease-in-out infinite}
      .flow{stroke-dasharray:6 10;animation:flow 3s linear infinite}
      .mote{animation:rise 14s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes breathe{50%{transform:scale(1.03)}}
      @keyframes flow{to{stroke-dashoffset:-32}}
      @keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-300px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.spin,.spin2,.breathe,.flow,.mote{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <!-- light shafts -->
    <g opacity=".07" fill="#9be7ff">
      <polygon points="640,0 700,0 560,440 470,440"/>
      <polygon points="820,0 850,0 760,440 710,440"/>
      <polygon points="1020,0 1070,0 990,440 920,440"/>
    </g>
    <circle cx="900" cy="212" r="260" fill="url(#glow)"/>
    <!-- orbit rings -->
    <g class="spin2" fill="none" stroke="#62d8ff">
      <ellipse cx="900" cy="212" rx="210" ry="62" stroke-opacity=".28" stroke-dasharray="1 7" stroke-width="2" stroke-linecap="round" transform="rotate(-12 900 212)"/>
      <ellipse cx="900" cy="212" rx="250" ry="80" stroke-opacity=".16" stroke-dasharray="1 9" stroke-width="2" stroke-linecap="round" transform="rotate(8 900 212)"/>
    </g>
    <!-- faceted data core -->
    <g class="breathe">
      <circle cx="900" cy="212" r="104" fill="url(#core)"/>
      <g fill="none" stroke="#9be7ff" stroke-opacity=".35" stroke-width="1">
        <polygon points="900,108 990,160 990,264 900,316 810,264 810,160"/>
        <polyline points="810,160 900,212 990,160"/>
        <polyline points="900,212 900,316"/>
        <polyline points="900,108 872,212 810,264"/>
        <polyline points="872,212 900,316"/>
        <polyline points="990,264 930,212 900,108"/>
      </g>
      <circle cx="900" cy="212" r="104" fill="none" stroke="#62d8ff" stroke-opacity=".6" stroke-width="1.5"/>
    </g>
    <g class="spin" fill="none" stroke="#58c8ff" stroke-opacity=".22">
      <polygon points="900,64 1028,138 1028,286 900,360 772,286 772,138"/>
      <polyline points="772,138 900,212 1028,138 M900,212 900,360"/>
    </g>
    <!-- waveform -->
    <path class="flow" d="M0 372 C 80 352, 120 392, 200 372 S 320 342, 400 372 S 520 402, 600 372 S 720 342, 800 372 S 920 402, 1000 372 S 1120 342, 1200 372" fill="none" stroke="url(#wave)" stroke-width="1.6"/>
    <path d="M0 386 C 100 376, 200 396, 300 386 S 500 376, 600 386 S 800 396, 900 386 S 1100 376, 1200 386" fill="none" stroke="#3d7dff" stroke-opacity=".22"/>
    <!-- motes -->
    <g fill="#9be7ff">
      <circle class="mote" cx="620" cy="430" r="1.4" style="animation-delay:-2s"/>
      <circle class="mote" cx="760" cy="440" r="1" style="animation-delay:-6s"/>
      <circle class="mote" cx="1040" cy="436" r="1.6" style="animation-delay:-9s"/>
      <circle class="mote" cx="1140" cy="440" r="1" style="animation-delay:-4s"/>
      <circle class="mote" cx="700" cy="440" r="1.2" style="animation-delay:-11s"/>
    </g>

    <!-- type -->
    <g class="mono" font-size="13" letter-spacing="3.2" fill="#b9cbe0">
      <circle cx="68" cy="76" r="4" fill="#62d8ff"/>
      <text x="84" y="81">DATA OBSERVATORY · VIRGINIA, USA</text>
    </g>
    <text class="sans" x="60" y="178" font-size="92" font-weight="700" letter-spacing="-4" fill="#eef6ff">SHINOJ</text>
    <text class="sans" x="60" y="262" font-size="92" font-weight="700" letter-spacing="-4" fill="url(#name2)">JERALD</text>
    <text class="sans" x="62" y="312" font-size="24" font-weight="500" fill="#eef6ff">Business Intelligence Analyst</text>
    <text class="mono" x="62" y="344" font-size="13.5" letter-spacing="2.6" fill="#9be7ff">DATA ANALYTICS  •  BI  •  PYTHON  •  SQL  •  POWER BI</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#8cc8ff" stroke-opacity=".18"/>
</svg>
