<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Enter the 3D portfolio</title>
  <defs>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#a6ecff"/>
      <stop offset=".5" stop-color="#62d8ff"/>
      <stop offset="1" stop-color="#3d9dff"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="300" y="24" width="600" height="72" rx="36"/></clipPath>
    <style>
      .sans{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
      .sweep{animation:sweep 4.5s ease-in-out infinite}
      .ring{transform-origin:600px 60px;animation:ring 3.2s ease-out infinite}
      @keyframes sweep{0%,55%{transform:translateX(-300px)}100%{transform:translateX(700px)}}
      @keyframes ring{from{transform:scale(1);opacity:.55}to{transform:scale(1.12,1.5);opacity:0}}
      @media (prefers-reduced-motion:reduce){.sweep,.ring{animation:none;opacity:0}}
    </style>
  </defs>
  <line x1="40" y1="60" x2="280" y2="60" stroke="#62d8ff" stroke-opacity=".35"/>
  <line x1="920" y1="60" x2="1160" y2="60" stroke="#62d8ff" stroke-opacity=".35"/>
  <circle cx="280" cy="60" r="3" fill="#62d8ff"/>
  <circle cx="920" cy="60" r="3" fill="#62d8ff"/>
  <rect class="ring" x="300" y="24" width="600" height="72" rx="36" fill="none" stroke="#62d8ff"/>
  <rect x="300" y="24" width="600" height="72" rx="36" fill="url(#b)"/>
  <g clip-path="url(#pill)"><rect class="sweep" x="300" y="24" width="160" height="72" fill="url(#sheen)"/></g>
  <text class="sans" x="578" y="68" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="3.6" fill="#03101f">ENTER THE 3D PORTFOLIO</text>
  <path d="M790 60 h26 m-9 -9 l9 9 l-9 9" fill="none" stroke="#03101f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="600" y="116" text-anchor="middle" font-size="11" letter-spacing="2.4" fill="#7f95b0">SHINOJJERALD.GITHUB.IO/SHINOJJERALD</text>
</svg>
