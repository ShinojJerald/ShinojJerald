<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AdZap — Choose the sites. Zap the ads.</title>
  <desc id="desc">A browser extension that blocks ads on the websites you choose.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#19133d"/>
      <stop offset="1" stop-color="#24205b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".52" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1015" cy="185" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="#a78bfa" stroke-opacity=".18">
    <circle cx="1010" cy="178" r="112"/>
    <circle cx="1010" cy="178" r="145"/>
    <circle cx="1010" cy="178" r="178"/>
    <path d="M810 178H1190M1010 0V360M870 38L1150 318M1150 38L870 318"/>
  </g>
  <g transform="translate(855 67)">
    <rect width="168" height="168" rx="42" fill="#7c3aed" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2"/>
    <path d="M98 18 43 94h37l-8 57 55-82H91z" fill="url(#bolt)"/>
    <path d="M112 111c21-2 35-19 35-39" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <circle cx="146" cy="65" r="5" fill="#38bdf8"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="116" fill="#c4b5fd" font-size="17" font-weight="700" letter-spacing="4">BROWSER EXTENSION</text>
    <text x="68" y="190" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2">AdZap</text>
    <text x="72" y="235" fill="#e5e7eb" font-size="27" font-weight="600">Choose the sites. Zap the ads.</text>
    <text x="72" y="275" fill="#b7b5d4" font-size="19">A browser ad blocker with per-site control.</text>
    <g transform="translate(72 306)" font-size="13" font-weight="700">
      <rect width="130" height="28" rx="14" fill="#8b5cf6" fill-opacity=".22" stroke="#a78bfa" stroke-opacity=".55"/>
      <text x="65" y="18" text-anchor="middle" fill="#ddd6fe">SITE BY SITE</text>
      <rect x="142" width="150" height="28" rx="14" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".5"/>
      <text x="217" y="18" text-anchor="middle" fill="#bae6fd">PRIVACY FILTERS</text>
      <rect x="304" width="158" height="28" rx="14" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="383" y="18" text-anchor="middle" fill="#e5e7eb">COSMETIC FILTERS</text>
    </g>
  </g>
</svg>